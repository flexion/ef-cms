version: '3.9'
services:
  dawson-db:
    image: postgres
    command: -c config_file=/etc/postgresql.conf
    restart: always
    container_name: dawson-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: example
      PGDATA: /data/postgres
    volumes:
      - dawson-db:/data/postgres
      - ./postgresql.conf:/etc/postgresql.conf

volumes:
  dawson-db:
